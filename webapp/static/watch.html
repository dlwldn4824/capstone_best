<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>핑계 게이지 · 워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
/* 워치는 늘 어둡다 (OLED). 시스템 테마를 따르지 않는다. */
:root{
  --face:#000000; --ink:#F2F5F4; --muted:#9AA6A1; --dim:#2A3230;
  --calm:#4DB8A6; --left:#E8A158; --alert:#F0826B; --exp:#A897E6;
  --size:min(100vw, 100vh);
}
html,body{height:100%; background:#000}
body{display:grid; place-items:center; color:var(--ink); font-family:var(--sans); overflow:hidden}
/* 큰 화면(노트북)에서 열면 시계 테두리를 그려 시연한다 */
@media (min-width:520px) and (min-height:520px){
  :root{--size:400px}
  body{background:#1B2120}
  .bezel{padding:18px; border-radius:50%; background:#2A302F; box-shadow:0 30px 60px rgba(0,0,0,.45), inset 0 0 0 2px #444C4A}
}
.face{width:var(--size); height:var(--size); border-radius:50%; background:var(--face); position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring{position:absolute; inset:0; width:100%; height:100%}
.center{position:relative; display:flex; flex-direction:column; align-items:center; gap:calc(var(--size)*0.012); text-align:center;
  width:72%; margin-top:calc(var(--size)*-0.02)}
.time{font-family:var(--mono); font-size:calc(var(--size)*0.045); color:var(--muted)}
.word{font-size:calc(var(--size)*0.105); font-weight:700; letter-spacing:-.02em; line-height:1.15}
.line{font-size:calc(var(--size)*0.04); color:var(--muted); line-height:1.35}
.dots{display:flex; gap:calc(var(--size)*0.02); margin-top:calc(var(--size)*0.01)}
.dots span{width:calc(var(--size)*0.05); height:calc(var(--size)*0.05); border-radius:50%; border:2px solid var(--dim)}
.dots span.f{border:none}
.live{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:calc(var(--size)*0.045); color:var(--ink)}
.live svg{width:calc(var(--size)*0.045); height:calc(var(--size)*0.045); color:var(--alert)}
.live.beat svg{animation:beat .35s ease-out}
@keyframes beat{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.why{position:absolute; bottom:calc(var(--size)*0.07); min-height:44px; min-width:calc(var(--size)*0.34); padding:0 18px; border-radius:99px;
  border:none; background:#1C2322; color:var(--ink); font-size:calc(var(--size)*0.042); font-weight:600}
.why.ask{background:var(--left); color:#1A1206}
/* 이유 고르기 */
.pick{position:absolute; inset:0; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:calc(var(--size)*0.02); padding:14%}
.pick.on{display:flex}
.pick h2{margin:0; font-size:calc(var(--size)*0.05); font-weight:600}
.pgrid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:calc(var(--size)*0.02); width:100%}
.pgrid button,.pnone{min-height:max(44px, calc(var(--size)*0.13)); border-radius:calc(var(--size)*0.05); border:2px solid #2E3735; background:#121716;
  color:var(--ink); font-size:calc(var(--size)*0.048); font-weight:600}
.pgrid button[aria-pressed="true"]{background:var(--calm); border-color:var(--calm); color:#04201B}
.pnone{width:100%; font-size:calc(var(--size)*0.04); font-weight:500}
.pnone[aria-pressed="true"]{border-color:var(--left); color:var(--left)}
.done{border:none; background:none; color:var(--muted); font-size:calc(var(--size)*0.04); min-height:44px; padding:0 16px}
.off{position:absolute; top:calc(var(--size)*0.13); font-size:calc(var(--size)*0.035); color:var(--alert); display:none}
.off.on{display:block}
[hidden]{display:none !important}
/* 워치 팝업: 원형 화면 가운데에 크게 */
.alarm{background:#000; padding:0}
.alarm-card{width:var(--size); height:var(--size); max-width:none; border-radius:50%; background:#000; color:var(--ink); box-shadow:none;
  border:none !important; align-items:center; justify-content:center; text-align:center; padding:16% 14%; gap:calc(var(--size)*0.02)}
.alarm-icon{width:calc(var(--size)*0.12); height:calc(var(--size)*0.12); border-radius:50%; background:#3A2A14; color:var(--left)}
.alarm-alert .alarm-icon{background:#3A1E17; color:var(--alert)}
.alarm-alert .alarm-card{box-shadow:inset 0 0 0 3px #5A2C22}
.alarm-title{font-size:calc(var(--size)*0.065)}
.alarm-body{font-size:calc(var(--size)*0.04); color:var(--muted); line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.alarm-flag{margin:0; font-size:calc(var(--size)*0.037); color:var(--ink); line-height:1.4}
.alarm-actions{width:100%; flex-direction:column; gap:6px}
.alarm-actions button{min-height:44px; border-radius:99px; border:none; background:#1C2322; color:var(--ink); font-size:calc(var(--size)*0.045)}
.alarm-actions .alarm-go{background:var(--left); color:#1A1206}

.peer{position:absolute; top:calc(var(--size)*0.13); font-size:calc(var(--size)*0.035); color:var(--muted); opacity:0; transition:opacity .3s}
.peer.on{opacity:1}
</style>
</head>
<body>
<div class="bezel">
  <main class="face" id="face">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="92" fill="none" stroke="#151B1A" stroke-width="7" stroke-dasharray="433.5 578" stroke-linecap="round" transform="rotate(135 100 100)"></circle>
      <circle id="band" cx="100" cy="100" r="92" fill="none" stroke="#123630" stroke-width="7" stroke-linecap="round" transform="rotate(135 100 100)"></circle>
      <circle id="mark" cx="100" cy="8" r="7" fill="#4DB8A6" stroke="#000" stroke-width="3"></circle>
    </svg>
    <p class="off" id="off">연결 끊김</p>
    <p class="peer" id="peer"></p>
    <div class="center">
      <span class="time num" id="time">--:--</span>
      <span class="word" id="word">…</span>
      <span class="line" id="line"></span>
      <div class="dots" id="dots"></div>
      <span class="live" id="live" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"></path></svg>
        <span id="bpm">–</span>
      </span>
    </div>
    <button class="why" id="why" type="button">이유</button>

    <section class="pick" id="pick" aria-label="어제 있었던 일">
      <h2>어제 있었던 일</h2>
      <div class="pgrid" id="pgrid"></div>
      <button class="pnone" id="pnone" type="button" aria-pressed="false">짚이는 게 없어요</button>
      <button class="done" id="done" type="button">닫기</button>
    </section>
  </main>
</div>

<script src="/app.js"></script>
<script>
"use strict";
let S = null;
const $ = (id) => document.getElementById(id);
const R = 92, C = 2 * Math.PI * R, ARC = C * 0.75;            // 270° 게이지
const zFrac = (z) => Math.max(0, Math.min(1, (z + 3) / 10));   // z −3 … +7

function setBand() {
  const a = zFrac(-2), b = zFrac(2);
  const band = $("band");
  band.setAttribute("stroke-dasharray", "0 " + (a * ARC) + " " + ((b - a) * ARC) + " " + C);
}
function setMark(z, color) {
  const f = z == null ? 0.3 : zFrac(z);
  const ang = (135 + f * 270) * Math.PI / 180;
  const m = $("mark");
  m.setAttribute("cx", 100 + R * Math.cos(ang));
  m.setAttribute("cy", 100 + R * Math.sin(ang));
  m.setAttribute("fill", color);
  m.style.display = z == null ? "none" : "";
}

const TONE = { calm: "var(--calm)", left: "var(--left)", alert: "var(--alert)", muted: "var(--muted)" };
const TONE_HEX = { calm: "#4DB8A6", left: "#E8A158", alert: "#F0826B", muted: "#9AA6A1" };

function render() {
  if (!S) return;
  const v = verdict(S), n = S.night || {};
  const word = { EXPLAINED: "그럴 만해요", WATCH: "남았어요", ALERT: (S.streak.k) + "일째", CALM: "평소", ASK: "물어볼게요" }[S.status] || v.short;
  $("word").textContent = word;
  $("word").style.color = TONE[v.tone];
  let line = "";
  if (n.night_hr != null) {
    line = "밤 심박 " + Math.round(n.night_hr) + (n.ref != null ? " · 평소 " + Math.round(n.ref) : "");
    if (S.status === "EXPLAINED" && n.explained_ko) line = n.explained_ko + " 때문 · " + line;
  } else line = v.title;
  $("line").textContent = line;
  setMark(n.z, TONE_HEX[v.tone]);

  const showDots = S.status === "WATCH" || S.status === "ALERT";
  $("dots").innerHTML = showDots
    ? Array.from({ length: S.streak.k }, (_, i) => '<span class="' + (i < S.streak.run ? "f" : "") + '" style="' +
        (i < S.streak.run ? "background:" + TONE[v.tone] : "") + '"></span>').join("")
    : "";

  const ask = S.status === "ASK";
  const why = $("why");
  why.classList.toggle("ask", ask);
  why.textContent = ask ? "왜 그랬을까요?" : "이유";
  why.hidden = n.night_hr == null || n.z == null;

  // 고르기 화면 상태
  const has = new Set(n.causes || []);
  $("pgrid").innerHTML = CONTEXT_ITEMS.map((c) => {
    const on = c.key === "sleep" ? has.has("sleep_debt") : has.has(c.key);
    return '<button type="button" data-ctx="' + c.key + '" aria-pressed="' + on + '">' + c.short + "</button>";
  }).join("");
  $("pnone").setAttribute("aria-pressed", !!n.nothing);
}

function onLive(l) {
  const fresh = l && l.bpm && Date.now() - (l.at || 0) < 15000;
  $("live").hidden = !fresh;
  if (!fresh) return;
  $("bpm").textContent = l.bpm;
  const el = $("live");
  el.classList.remove("beat"); void el.offsetWidth; el.classList.add("beat");
}

$("why").addEventListener("click", () => $("pick").classList.add("on"));
$("done").addEventListener("click", () => $("pick").classList.remove("on"));
$("pick").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-ctx]");
  if (!b) return;
  const now = b.getAttribute("aria-pressed") === "true";
  S = await API.post("/api/context", { [b.dataset.ctx]: !now });
  render();
});
$("pnone").addEventListener("click", async () => {
  const now = $("pnone").getAttribute("aria-pressed") === "true";
  S = await API.post("/api/context", { nothing: !now });
  render();
  $("pick").classList.remove("on");
});

function tick() {
  const d = new Date();
  $("time").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
setBand(); tick(); setInterval(tick, 10000);
API.get("/api/state").then((s) => { if (!S) { S = s; render(); onLive(s.live); } }).catch(() => {});

// 팝업: 이유를 물어보면 워치에서 바로 고르게, 사흘째면 119 기준을 덧붙인다
Alarm.setActions({ ASK: { label: "이유 고르기", run: () => $("pick").classList.add("on") } });
Alarm.setDecorate((n, el) => {
  if (n.kind !== "ALERT") return;
  const p = document.createElement("p");
  p.className = "alarm-flag";
  p.textContent = "몸이 많이 안 좋다면 폰에서 증상 안내를 확인하세요";
  el.querySelector(".alarm-body").after(p);
});

let lastPhone = null;
function onPresence(p) {
  const n = p.phone || 0;
  if (lastPhone !== null && n !== lastPhone) {
    const el = $("peer");
    el.textContent = n > lastPhone ? "폰과 연결됐어요" : "폰 연결이 끊겼어요";
    el.classList.add("on");
    clearTimeout(onPresence._t);
    onPresence._t = setTimeout(() => el.classList.remove("on"), 2500);
  }
  lastPhone = n;
}

subscribe("watch", {
  state: (s) => { S = s; render(); onLive(s.live); },
  live: onLive,
  notify: (n) => Alarm.show(n),
  dismiss: (d) => Alarm.remove(d.id),
  presence: onPresence,
  conn: (on) => $("off").classList.toggle("on", !on),
});
// 워치는 첫 터치로 소리·진동 잠금을 푼다
document.addEventListener("pointerdown", () => Alarm.unlock(), { once: true });
</script>
</body>
</html>
