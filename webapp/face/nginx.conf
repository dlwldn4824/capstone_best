server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;   # Cloud Run 앞단 주소 그대로 /face/ 로 보낸다 (:8080 이 붙지 않게)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # location 안에서 add_header 를 쓰면 server 쪽 헤더가 빠지므로 각 location 에 같이 둔다
  set $pp "camera=(self), microphone=()";

  location = /              { return 302 /face/; }
  location = /face          { return 301 /face/; }
  location = /face/sw.js    { add_header Cache-Control "no-cache"; add_header Permissions-Policy $pp always; }
  location = /face/index.html { add_header Cache-Control "no-cache"; add_header Permissions-Policy $pp always; add_header X-Content-Type-Options nosniff always; }
  location /face/assets/    { add_header Cache-Control "public, max-age=31536000, immutable"; }   # vite 해시 파일
  location /face/mediapipe/ { add_header Cache-Control "public, max-age=604800"; }
  location /assets/         { add_header Cache-Control "public, max-age=86400"; }                 # 캐릭터 · 글꼴 (이름에 해시 없음)
  location ~ \.webmanifest$ { default_type application/manifest+json; }
  location /face/           { try_files $uri $uri/ /face/index.html; }
}
