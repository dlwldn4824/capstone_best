server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # location 안에서 add_header 를 쓰면 server 쪽 헤더가 빠지므로 각 location 에 같이 둔다
  set $pp "camera=(self), microphone=()";

  location = /sw.js         { add_header Cache-Control "no-cache"; add_header Permissions-Policy $pp always; }
  location = /index.html    { add_header Cache-Control "no-cache"; add_header Permissions-Policy $pp always; add_header X-Content-Type-Options nosniff always; }
  location /assets/         { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /mediapipe/      { add_header Cache-Control "public, max-age=604800"; }
  location ~ \.webmanifest$ { default_type application/manifest+json; }
  location / { try_files $uri $uri/ /index.html; }
}
