[project]
name = "wesad-phase1"
version = "0.1.0"
description = "WESAD wrist REST vs STRESS window dataset and physiological fact extractor"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wesad-download = "wesad_phase1.cli:download_main"
wesad-windows = "wesad_phase1.cli:windows_main"
