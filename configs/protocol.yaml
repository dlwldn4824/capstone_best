# ---------------------------------------------------------------------------
# tags.csv 세그먼트 -> 라벨 매핑
#
# !! Day 1 에 반드시 검증할 것 !!
#   이 매핑은 Hongn et al. (Sci Data 2025) 본문의 프로토콜 서술로부터
#   재구성한 것이며, 실제 tags.csv 의 태그 개수로 확인되지 않았다.
#   `python scripts/01_audit.py` 가 피험자별 실제 태그 수를 출력한다.
#   expected_segments 와 다르면 그 피험자는 needs_review 로 표시되고
#   feature 추출에서 자동 제외된다. 눈으로 확인한 뒤 여기를 고칠 것.
#
# 규칙
#   - N개의 태그는 N-1개의 구간을 만든다 (태그 = 구간 경계).
#   - labels 는 그 구간들에 순서대로 대응한다.
#   - null  = 그 구간은 사용하지 않는다 (전이/쿨다운 등).
#   - portion: all | second_half | middle_60s
#       원 논문의 세그먼트 선택 규칙을 반영한다.
#         rest 블록  -> second_half (잔여 스트레스 효과 최소화)
#         aerobic 블록-> middle_60s  (블록 중앙 1분)
#         sprint     -> all
#
# 버전: 피험자 ID 접두사로 결정 (S* = cohort 1 = v1, f* = cohort 2 = v2)
# ---------------------------------------------------------------------------

version_by_prefix:
  S: v1
  f: v2

STRESS:
  v1:
    # 3분 baseline / Stroop / 5분 rest / TMCT / 5분 rest / Opinion / Subtract
    expected_segments: 7
    labels:   [REST,        STRESS,  REST,        STRESS, REST,        STRESS,  STRESS]
    portions: [second_half, all,     second_half, all,    second_half, all,     all]
    names:    [baseline,    stroop,  rest1,       tmct,   rest2,       opinion, subtract]
  v2:
    # Stroop 제거, 두 번째 rest 를 opinion 과 subtract 사이로 이동
    expected_segments: 6
    labels:   [REST,        STRESS, REST,        STRESS,  REST,        STRESS]
    portions: [second_half, all,    second_half, all,     second_half, all]
    names:    [baseline,    tmct,   rest1,       opinion, rest2,       subtract]

AEROBIC:
  v1:
    # 3분 baseline / 60,70,75 / 80,85,90,95 / 100,105,110 / 4분 cool-down / 2분 rest
    expected_segments: 13
    labels:   [REST,        AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   null,     REST]
    portions: [second_half, middle_60s,middle_60s,middle_60s,middle_60s,middle_60s,middle_60s,middle_60s,middle_60s,middle_60s,middle_60s,all,      second_half]
    names:    [baseline,    rpm60,     rpm70,     rpm75,     rpm80,     rpm85,     rpm90,     rpm95,     rpm100,    rpm105,    rpm110,    cooldown, rest_end]
  v2:
    # baseline / 2:15 warm-up / 70,75,80 / 85 (11:15) / 90-95 (4:30) / 3분 cool-down / rest
    expected_segments: 9
    labels:   [REST,        null,    AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   AEROBIC,   null,     REST]
    portions: [second_half, all,     middle_60s,middle_60s,middle_60s,middle_60s,middle_60s,all,      second_half]
    names:    [baseline,    warmup,  rpm70,     rpm75,     rpm80,     rpm85,     rpm90_95,  cooldown, rest_end]

ANAEROBIC:
  v1:
    # 3분 baseline / (30s sprint + 4분 cool-down) x3 / 2분 rest
    expected_segments: 8
    labels:   [REST,        SPRINT, null,     SPRINT, null,     SPRINT, null,     REST]
    portions: [second_half, all,    all,      all,    all,      all,    all,      second_half]
    names:    [baseline,    sprint1,cooldown1,sprint2,cooldown2,sprint3,cooldown3,rest_end]
  v2:
    # baseline / (45s sprint + cool-down) x4
    expected_segments: 9
    labels:   [REST,        SPRINT, null,     SPRINT, null,     SPRINT, null,     SPRINT, null]
    portions: [second_half, all,    all,      all,    all,      all,    all,      all,    all]
    names:    [baseline,    sprint1,cooldown1,sprint2,cooldown2,sprint3,cooldown3,sprint4,cooldown4]
