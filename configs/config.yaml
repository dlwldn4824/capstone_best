# ---------------------------------------------------------------------------
# Wearable Stress & Exercise  ·  NeSy 1차 실험 설정
# 데이터: PhysioNet "Wearable Device Dataset from Induced Stress and
#         Structured Exercise Sessions" v1.0.1 (Hongn et al., Sci Data 2025)
# ---------------------------------------------------------------------------
paths:
  raw: data/raw/wearable-device-dataset-from-induced-stress-and-structured-exercise-sessions-1.0.1/Wearable_Dataset
  interim: data/interim
  outputs: outputs
  features_csv: outputs/features.csv

sampling_rate:      # PhysioNet 문서 기준 (io_e4 가 파일 헤더로 재확인함)
  BVP: 64
  ACC: 32
  EDA: 4
  TEMP: 4
  HR: 1

window:
  # 원 논문은 프로토콜 블록 전체를 세그먼트로 사용한다.
  # 우리는 블록을 다시 고정 윈도로 잘라 표본 수를 늘린다.
  length_sec: 60
  step_sec: 30
  min_valid_ratio: 0.8   # 윈도 내 유효(non-NaN) 샘플 최소 비율

hrv:
  # BVP peak detection
  bandpass: [0.5, 10.0]
  min_bpm: 40
  max_bpm: 200
  # IBI artefact 제거: 직전 IBI 대비 변화율 임계
  ibi_rel_thresh: 0.30
  min_beats_for_freq: 30   # 이보다 적으면 주파수영역 feature = NaN

eda:
  lowpass_hz: 1.0        # raw 잡음 제거
  tonic_cutoff_hz: 0.05  # 이 아래 = tonic, 위 = phasic
  scr_min_amplitude: 0.01  # microsiemens
  scr_min_distance_sec: 1.0

labels:
  # 4-class -> 3-class 매핑 (AEROBIC + SPRINT = EXERCISE)
  three_class:
    REST: REST
    STRESS: STRESS
    AEROBIC: EXERCISE
    SPRINT: EXERCISE

exclude:
  # 원 논문이 분류 실험에서 제외한 피험자 (기기 착용 불량)
  ml_excluded_subjects: [f07, f13]
  # data_constraints.txt 에 기록된 품질 이슈 (제외가 아니라 '표시')
  flagged:
    S02: [STRESS]      # stress 데이터 중복
    f14: [STRESS]      # stress 데이터가 두 파트로 분할
    S03: [AEROBIC]     # aerobic 세션 불완전
    S07: [AEROBIC]
    S11: [AEROBIC]     # aerobic 데이터 두 파트로 분할
    S12: [AEROBIC]     # aerobic 세션 없음
    S06: [ANAEROBIC]   # anaerobic 세션 불완전
    S16: [ANAEROBIC]   # anaerobic 데이터 두 파트로 분할

eval:
  scheme: group_kfold   # group_kfold | loso | random
  n_splits: 5
  random_state: 42

seed: 42
